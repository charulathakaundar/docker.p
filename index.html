<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #5568d9;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4f4f4;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        li.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .delete {
            background: #e74c3c;
            padding: 7px 10px;
        }

        .delete:hover {
            background: #c0392b;
        }

        .task {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📝 My To-Do List</h1>
      <h2>Charu</h2>

        <div class="input-box">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a task..."
            >
            <button onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");

        function addTask() {
            const taskText = taskInput.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            const li = document.createElement("li");

            const span = document.createElement("span");
            span.textContent = taskText;
            span.className = "task";

            span.onclick = function () {
                li.classList.toggle("completed");
            };

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";

            deleteButton.onclick = function () {
                li.remove();
            };

            li.appendChild(span);
            li.appendChild(deleteButton);

            taskList.appendChild(li);

            taskInput.value = "";
            taskInput.focus();
        }

        taskInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>

</body>
</html>
